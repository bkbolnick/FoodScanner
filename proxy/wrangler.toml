# Cloudflare Worker that holds the API keys for FoodScanner. Deploy with: npx wrangler deploy, or from a phone through
# .github/workflows/deploy-proxy.yml (see README.md).
name = "foodscanner-proxy"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
# Browsers on these pages may use the proxy. Add http://localhost:8000 while developing locally.
ALLOWED_ORIGINS = "https://bkbolnick.github.io"
# The only model the app asks for; anything else is refused so a leaked URL cannot run other models on your key.
ALLOWED_MODELS = "claude-opus-5"
# Upper bound on max_tokens per request (a week of meals asks for 32000).
MAX_TOKENS = "32000"

# Secrets are set once and never written to this file (the deploy workflow sets them from repository secrets):
#   npx wrangler secret put ANTHROPIC_API_KEY   (required for the AI features)
#   npx wrangler secret put USDA_API_KEY        (optional: the Worker then answers the app's USDA lookups too)
#   npx wrangler secret put PROXY_TOKEN         (optional: the app must then send the same token)

# More than 30 requests a minute from one address are refused (a barcode lookup is up to four requests, a photo or a
# menu one, a week of meals one). This is what stops a stranger who found the URL from burning the USDA quota or the
# Anthropic spend limit in a loop. Remove the block to switch it off.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
