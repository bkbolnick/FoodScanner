# Deploys proxy/ (the Cloudflare Worker that holds the site's API keys) and points the site at it, so the whole set-up
# can be done from a phone: add the repository secrets named below under Settings > Secrets and variables > Actions,
# then merge a change under proxy/ or run this workflow by hand. See proxy/README.md, "From a phone".
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN   required; a token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  optional; the workflow finds the account itself when the token can see only one
#   GEMINI_API_KEY         a free key from aistudio.google.com/apikey. The app asks this one first and it is the only
#                          one of the three that reads photos really well, so set this one if you set nothing else
#   GROQ_API_KEY           optional, free, from console.groq.com/keys; the fast fallback
#   OPENROUTER_API_KEY     optional, free, from openrouter.ai/keys; the last fallback
#   ANTHROPIC_API_KEY      optional and NOT free. The app never asks for it on the site's keys, so setting it here only
#                          serves people who point their own phone at this proxy
#   USDA_API_KEY           optional; lets the Worker answer USDA lookups for every visitor
#   PROXY_TOKEN            optional; letters, digits, dashes and underscores only. It is also written into the public
#                          page, so it only deters scripts (see the README)
# A secret that is missing here is left as it is on the Worker, so keys can also be managed in the Cloudflare dashboard.
name: Deploy the AI proxy

on:
  push:
    branches: [main]
    paths: ['proxy/**', '.github/workflows/deploy-proxy.yml']
  workflow_dispatch:

permissions:
  contents: write   # to write the Worker URL into index.html (DEFAULT_PROXY)

concurrency: deploy-proxy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # GitHub's explicit bash runs with -eo pipefail, so a failed `wrangler deploy | tee` fails the step
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5   # the runner's own Node (22 or newer) is enough for wrangler

      - name: Check the Cloudflare token and find the account
        env:
          ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The repository secret CLOUDFLARE_API_TOKEN is not set. Add it under Settings > Secrets and variables > Actions (a token from the 'Edit Cloudflare Workers' template), then re-run this workflow."
            exit 1
          fi
          if [ -n "$ACCOUNT_ID_SECRET" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID_SECRET" >> "$GITHUB_ENV"
            echo "Using the account from the CLOUDFLARE_ACCOUNT_ID secret"
            exit 0
          fi
          # No account id given: ask Cloudflare which accounts the token can see and use the one, if there is exactly one.
          accounts=$(curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);process.stdout.write((j.result||[]).map(a=>a.id+" "+a.name).join("\n"))}catch(e){}})')
          count=$(printf '%s' "$accounts" | grep -c . || true)
          if [ "$count" = "1" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=${accounts%% *}" >> "$GITHUB_ENV"
            echo "Using the only account the token can see: ${accounts#* }"
          elif [ "$count" = "0" ]; then
            echo "::error::The token cannot list any account (is it from the 'Edit Cloudflare Workers' template?). Add the repository secret CLOUDFLARE_ACCOUNT_ID: it is in the 'Account details' box at the bottom of the Workers & Pages overview page, or in the address bar after dash.cloudflare.com/ on any account page."
            exit 1
          else
            echo "::error::The token can see $count accounts. Add the repository secret CLOUDFLARE_ACCOUNT_ID to say which one (the 'Account details' box on the Workers & Pages overview page)."
            exit 1
          fi

      - name: Deploy the Worker
        id: deploy
        working-directory: proxy
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          if [ -z "$url" ]; then
            # wrangler did not print a workers.dev URL: look the account's subdomain up and build it from the Worker name.
            name=$(sed -n 's/^name *= *"\(.*\)".*/\1/p' wrangler.toml | head -1)
            sub=$(curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);process.stdout.write((j.result&&j.result.subdomain)||"")}catch(e){}})' || true)
            if [ -n "$name" ] && [ -n "$sub" ]; then url="https://$name.$sub.workers.dev"; fi
          fi
          if [ -z "$url" ]; then
            echo "::warning::Could not work out the Worker's URL. Open the Worker in the Cloudflare dashboard (Workers & Pages) to find it, then put it in DEFAULT_PROXY in index.html."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          rm -f deploy.log

      - name: Set the Worker's secrets
        working-directory: proxy
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
        run: |
          case "$PROXY_TOKEN" in
            *[!A-Za-z0-9_-]*)
              echo "::error::PROXY_TOKEN may only contain letters, digits, dashes and underscores (it is written into index.html as well as set on the Worker). Change the repository secret and re-run."
              exit 1;;
          esac
          for name in GEMINI_API_KEY GROQ_API_KEY OPENROUTER_API_KEY ANTHROPIC_API_KEY USDA_API_KEY PROXY_TOKEN; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" > /dev/null
              echo "$name: set on the Worker from the repository secret"
            else
              echo "$name: no repository secret, left as it is on the Worker"
            fi
          done
          if [ -z "$GEMINI_API_KEY$GROQ_API_KEY$OPENROUTER_API_KEY" ]; then
            echo "::warning::None of GEMINI_API_KEY, GROQ_API_KEY or OPENROUTER_API_KEY is a repository secret. The AI features stay off for everyone who has not saved a key of their own, until one is set here or in the Cloudflare dashboard (the Worker > Settings > Variables and Secrets). All three are free; GEMINI_API_KEY is the one to set first."
          fi

      - name: Check the proxy
        id: health
        env:
          URL: ${{ steps.deploy.outputs.url }}
          WANT_USDA: ${{ secrets.USDA_API_KEY != '' }}
        run: |
          [ -n "$URL" ] || exit 0
          # The secrets just set take a few seconds to reach the edge, so the check is retried; the answer is flattened to
          # one short line because an HTML error page would otherwise break the outputs file.
          for i in 1 2 3 4 5; do
            code=$(curl -sS --max-time 20 -o body.txt -w '%{http_code}' "$URL/" || echo "000")
            answer=$(tr '\r\n' '  ' < body.txt | head -c 300)
            usda=no; case "$answer" in *usda/foods/search*) usda=yes;; esac
            case "$answer" in *"is running"*) if [ "$WANT_USDA" != "true" ] || [ "$usda" = "yes" ]; then break; fi;; esac
            sleep 4
          done
          rm -f body.txt
          echo "$URL/ answered HTTP $code: $answer"
          echo "answer=HTTP $code: $answer" >> "$GITHUB_OUTPUT"
          echo "usda=$usda" >> "$GITHUB_OUTPUT"
          if [ "$WANT_USDA" = "true" ] && [ "$usda" != "yes" ]; then echo "::warning::The Worker does not report the USDA route yet; if the first barcode lookup on the site says the proxy has no USDA key, run this workflow again."; fi

      - name: Point the site at the proxy
        id: site
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
        run: |
          [ -n "$URL" ] || { echo "result=no URL, index.html left alone" >> "$GITHUB_OUTPUT"; exit 0; }
          outcome=$(node - <<'JS'
          const fs = require('fs');
          const url = process.env.URL, token = process.env.PROXY_TOKEN || '';   // the token was checked for quotes and backslashes in the secrets step
          let src = fs.readFileSync('index.html', 'utf8');
          const cur = /^var DEFAULT_PROXY = '([^']*)';/m.exec(src);
          if (!cur) { console.log('left: index.html has no DEFAULT_PROXY line'); process.exit(0); }
          if (cur[1] && !/\.workers\.dev\/?$/.test(cur[1])) { console.log('left: DEFAULT_PROXY is ' + cur[1] + ', set by hand'); process.exit(0); }
          src = src.replace(/^var DEFAULT_PROXY = '[^']*';/m, function () { return "var DEFAULT_PROXY = '" + url + "';"; });
          if (token) src = src.replace(/^var DEFAULT_PROXY_TOKEN = '[^']*';/m, function () { return "var DEFAULT_PROXY_TOKEN = '" + token + "';"; });
          if (src === fs.readFileSync('index.html', 'utf8')) { console.log('same'); process.exit(0); }
          fs.writeFileSync('index.html', src);
          console.log('changed');
          JS
          )
          case "$outcome" in
            left:*) echo "${outcome#left: }; index.html left alone"; echo "result=${outcome#left: }; index.html left alone" >> "$GITHUB_OUTPUT"; exit 0;;
            same) echo "index.html already points at $URL"; echo "result=already pointed at the proxy" >> "$GITHUB_OUTPUT"; exit 0;;
            changed) ;;
            *) echo "::error::Unexpected outcome from the update script: $outcome"; exit 1;;
          esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "Point the site at the deployed AI proxy" -- index.html
          if git push; then
            echo "result=index.html updated; GitHub Pages publishes it within a minute or two" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not push the index.html change (branch protection?). Set DEFAULT_PROXY to $URL by hand."
            echo "result=could not push; set DEFAULT_PROXY to $URL by hand" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ANSWER: ${{ steps.health.outputs.answer }}
          USDA: ${{ steps.health.outputs.usda }}
          SITE: ${{ steps.site.outputs.result }}
        run: |
          {
            echo "## AI proxy"
            echo
            if [ -n "$URL" ]; then echo "- Deployed at **$URL**"; else echo "- Deployed, but the URL could not be read; find it in the Cloudflare dashboard"; fi
            [ -n "$ANSWER" ] && echo "- Health check: $ANSWER"
            [ "$USDA" = "yes" ] && echo "- USDA lookups: on (the Worker has a USDA key)"
            [ "$USDA" = "no" ] && echo "- USDA lookups: off (no USDA_API_KEY on the Worker)"
            [ -n "$SITE" ] && echo "- Site: $SITE"
          } >> "$GITHUB_STEP_SUMMARY"
